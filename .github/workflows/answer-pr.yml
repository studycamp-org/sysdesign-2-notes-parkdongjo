# 챕터 답안(chXX/정리.md)이 main에 push되면, 서로 리뷰할 수 있도록
# 이 저장소 안에 "답안만 담긴 PR"(chXX-base ← chXX-answer)을 자동으로 만듭니다.
# 점수·채점 없음. 자동 GITHUB_TOKEN만 사용하며 외부 시크릿이 필요 없습니다.
name: answer-pr
on:
  push:
    branches: [main]
    paths: ['ch*/정리.md']
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: answer-pr
  cancel-in-progress: false
jobs:
  pr:
    if: github.repository != 'studycamp-org/sysdesign-2-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: create or update chapter answer PR
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "answer-pr-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE=$(git rev-parse "$AFTER^" 2>/dev/null || echo "$AFTER")
          fi
          CHAPTERS=$(git diff --name-only "$BEFORE" "$AFTER" -- 'ch*/정리.md' | cut -d/ -f1 | sort -u)
          for ch in $CHAPTERS; do
            # base: 최초 제출 직전 커밋에 1회 고정 (답안 diff만 깨끗하게 보이도록)
            if ! git ls-remote --exit-code origin "refs/heads/${ch}-base" >/dev/null 2>&1; then
              git push origin "$BEFORE:refs/heads/${ch}-base"
            fi
            git fetch origin "${ch}-base"
            git checkout -B "${ch}-answer" "origin/${ch}-base"
            git checkout "$AFTER" -- "${ch}/"
            git add -A -- "${ch}/"
            if ! git diff --cached --quiet; then
              git commit -m "${ch} 답안 (main 동기화)"
            fi
            git push -f origin "${ch}-answer"
            OPEN=$(gh pr list --head "${ch}-answer" --base "${ch}-base" --state open --json number --jq length)
            if [ "$OPEN" = "0" ]; then
              gh pr create --base "${ch}-base" --head "${ch}-answer" \
                --title "[${ch}] 답안 리뷰" \
                --body "${ch} 답안을 서로 리뷰하기 위한 자동 생성 PR입니다. 점수는 없어요 — inline 코멘트로 의견을 나눠 주세요 👀"
            fi
          done
